<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Catan advisor options</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="page">
  <h1>Catan advisor options</h1>
  <p class="note">Advisor for private games with friends who agree. Doesn't read or control colonist.io.</p>
  <form id="f" class="panel">
    <label>Lab server
      <input id="server" type="text" placeholder="http://127.0.0.1:8000" data-testid="server">
    </label>
    <label>Reader
      <select id="backend">
        <option value="auto">Auto (Gemini when a key is set, else colour tables)</option>
        <option value="llm">Gemini (sends the screenshot to Google)</option>
        <option value="color">Colour tables (offline)</option>
      </select>
    </label>
    <label>Players
      <select id="numPlayers"><option>2</option><option>3</option><option>4</option></select>
    </label>
    <button class="btn primary">Save</button>
    <p id="msg" role="status" class="mist"></p>
  </form>
  <p class="mist">Hotkey: Alt+Shift+K by default. Change it at chrome://extensions/shortcuts.</p>
  <script type="module" src="options.js"></script>
</body>
</html>
