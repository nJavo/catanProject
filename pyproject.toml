[project]
name = "catan-lab"
version = "0.1.0"
description = "Catan rules engine, web game, AI lab and RL agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "fastapi",
    "uvicorn[standard]",
    "pyyaml",
    "torch",
    "pillow",            # screenshot import (docs/VISION_IMPORT.md)
]

[project.scripts]
catan-server = "catan.server.__main__:main"
catan-play = "catan.play:main"

[dependency-groups]
dev = ["pytest", "hypothesis", "httpx", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["catan*"]

[tool.setuptools.package-data]
"catan.vision" = ["profiles/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# repo root on sys.path for plain `pytest` too (tests import scripts.*), as `python -m pytest` does
pythonpath = ["."]

[tool.ruff]
# Minimal lint: syntax errors and pyflakes (undefined names, unused imports/variables).
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # package re-exports
"tests/**" = ["F811"]      # pytest fixtures imported from a sibling test module
